                        <h3 class="text-3xl md:text-5xl font-bold">${data.province}</h3>
                        <p class="text-lg md:text-xl text-gray-200 mt-1">${data.tagline}</p>

                </div>

                        <p class="text-gray-700 leading-relaxed">${data.desc}</p>
                    </div>

                        <!-- Attractions -->
                        <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h5 class="font-bold text-lg text-gray-900 mb-4 flex items-center gap-2">
                                <span class="text-secondary">📍</span> สถานที่ท่องเที่ยวแนะนำ
                            </h5>
                            <ul class="space-y-4">
                                ${data.attractions.map(item => `
                                    <li class="border-b border-gray-200 pb-3 last:border-0">
                                        <strong class="text-primary block">${item.name}</strong>
                                        <span class="text-sm text-gray-600">${item.desc}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Food -->
                        <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h5 class="font-bold text-lg text-gray-900 mb-4 flex items-center gap-2">
                                <span class="text-secondary">🍜</span> ของกินขึ้นชื่อ
                            </h5>
                            <ul class="space-y-4">
                                ${data.foods.map(item => `
                                    <li class="border-b border-gray-200 pb-3 last:border-0">
                                        <strong class="text-primary block">${item.name}</strong>
                                        <span class="text-sm text-gray-600">${item.desc}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Hotels -->
                        <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h5 class="font-bold text-lg text-gray-900 mb-4 flex items-center gap-2">
                                <span class="text-secondary">🏨</span> ที่พักแนะนำ
                            </h5>
                            <ul class="space-y-4">
                                ${data.hotels.map(item => `
                                    <li class="border-b border-gray-200 pb-3 last:border-0">
                                        <strong class="text-primary block">${item.name}</strong>
                                        <span class="text-sm text-gray-600">${item.desc}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize with North region on load
        window.onload = () => {
            switchRegion('north');
        };
    </script>
